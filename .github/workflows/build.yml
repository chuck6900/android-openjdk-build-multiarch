name: Build OpenJDK 21 for iOS

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 */2 *"

jobs:
  build_iosport:
    strategy:
      matrix:
        version: [21]
      fail-fast: false

    name: "Build Java ${{ matrix.version }} for iOS aarch64"
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Procursus (or any necessary deps)
      - name: Install Procursus dependencies
        run: |
          brew install coreutils wget tar xz

      # Add Procursus path (adjust if you have custom scripts there)
      - name: Setup Procursus environment
        run: |
          # GitHub runners don’t have /opt/procursus by default, so use /usr/local or /opt/homebrew
          mkdir -p /opt/procursus/bin
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export JAVA_HOME=$(/usr/libexec/java_home -v ${{ matrix.version }})
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Build with CI build script
        run: |
          export PATH=$PATH
          export JAVA_HOME=$JAVA_HOME
          export BUILD_IOS=1
          export TARGET_VERSION=${{ matrix.version }}
          bash "1_ci_build_arch_aarch64.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk${{ matrix.version }}-ios-aarch64"
          path: jdk${{ matrix.version }}*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-aarch64"
          path: jre${{ matrix.version }}*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-debuginfo-aarch64"
          path: dizout
